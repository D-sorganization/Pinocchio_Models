schema: model_pack/v1
repo: Pinocchio_Models
package: pinocchio_models
engine: pinocchio
engine_version: ">=2.7"
anthropometrics: winter_2009
format: urdf
capabilities:
  load_in_engine: {level: full, evidence: tests/parity/test_engine_conformance.py}
  forward_kinematics: {level: full, evidence: tests/parity/test_forward_kinematics.py}
  inverse_kinematics: {level: partial, evidence: null}
  forward_dynamics: {level: partial, evidence: null}
  inverse_dynamics: {level: full, evidence: tests/parity/test_inverse_dynamics.py}
  contact_grf: {level: none, evidence: null}
  urdf_import: {level: none, evidence: null}
  urdf_export: {level: full, evidence: tests/parity/test_engine_conformance.py}
  video_export: {level: none, evidence: null}
addons:
  gepetto: optional
  pink: optional
  crocoddyl: optional
models_root: src/pinocchio_models/exercises
exercises:
  - id: squat
    path: src/pinocchio_models/exercises/squat
  - id: deadlift
    path: src/pinocchio_models/exercises/deadlift
  - id: bench_press
    path: src/pinocchio_models/exercises/bench_press
  - id: snatch
    path: src/pinocchio_models/exercises/snatch
  - id: clean_and_jerk
    path: src/pinocchio_models/exercises/clean_and_jerk
  - id: gait
    path: src/pinocchio_models/exercises/gait
  - id: sit_to_stand
    path: src/pinocchio_models/exercises/sit_to_stand
